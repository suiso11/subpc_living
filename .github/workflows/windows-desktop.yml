name: Windows desktop

on:
  workflow_dispatch:
  push:
    paths:
      - "src/desktop/**"
      - "tests/test_desktop_*.py"
      - "requirements-desktop.txt"
      - "subpc-desktop.spec"
      - "scripts/build_windows_desktop.ps1"
      - ".github/workflows/windows-desktop.yml"
  pull_request:
    paths:
      - "src/desktop/**"
      - "tests/test_desktop_*.py"
      - "requirements-desktop.txt"
      - "subpc-desktop.spec"
      - "scripts/build_windows_desktop.ps1"
      - ".github/workflows/windows-desktop.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt "pyinstaller>=6.10,<7"

      - name: Test native client and load QML
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests.test_desktop_api tests.test_desktop_contract tests.test_desktop_qml -v

      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean subpc-desktop.spec

      - name: Smoke-test executable startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\SUBPC-BUDDY.exe" -ArgumentList "--no-tray", "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "SUBPC-BUDDY.exe smoke test failed with code $($process.ExitCode)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: SUBPC-BUDDY-windows
          path: dist/SUBPC-BUDDY.exe
          if-no-files-found: error
