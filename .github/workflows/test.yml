name: Offline unit tests (Linux)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Static check (whitespace errors in HEAD patch)
        run: |
          if git rev-parse --verify -q HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --check --format= --no-renames HEAD
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Static check (bytecode compile)
        run: python -m compileall -q src tests

      - name: Install minimal CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Unit-test slices (LLM)
        run: python -m unittest discover -s tests/llm -t . -q

      - name: Unit-test slices (assistant)
        run: python -m unittest discover -s tests/assistant -t . -q

      - name: Unit-test slices (context)
        run: python -m unittest discover -s tests/context -t . -q

      - name: Unit-test slices (chat)
        run: python -m unittest discover -s tests/chat -t . -q

      - name: Unit-test slices (tasks)
        run: python -m unittest tests.test_task_decomposer tests.test_prioritizer tests.test_tasks_store tests.test_tasks_reminder tests.test_task_formatting tests.test_calendar_sync -q

      - name: Unit-test slices (perception policy)
        run: python -m unittest tests.perception.test_sensor_policy -q

      - name: Markdown link checker unit tests
        run: python -m unittest tests.test_markdown_links -q

      - name: Check local Markdown links
        run: python scripts/check_markdown_links.py docs readme.md