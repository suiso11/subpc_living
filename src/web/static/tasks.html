<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#171326">
  <title>やること | subpc buddy</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/hallmark-theme.css">
</head>
<body class="tasks-page">
  <div class="task-app">
    <header class="task-header site-header">
      <div class="task-brand site-brand">
        <span class="task-brand-mark"></span>
        <span>SUBPC BUDDY</span>
      </div>
      <nav class="top-nav" aria-label="画面切替">
        <a class="top-nav-link" href="/">話す</a>
        <a class="top-nav-link active" href="/tasks">やること</a>
        <a class="top-nav-link" href="/logs">記録</a>
        <a class="top-nav-link" href="/achievements">実績</a>
      </nav>
      <div class="site-actions">
        <button class="utility-btn" id="task-refresh-btn" type="button" title="最新の状態を読み直す">
          <span aria-hidden="true">↻</span><span class="utility-label">読み直す</span>
        </button>
      </div>
    </header>

    <main class="task-workspace">
      <section class="page-heading" aria-labelledby="tasks-page-title">
        <div>
          <span class="page-label">今日のプラン</span>
          <h1 id="tasks-page-title">やること</h1>
          <p>今やることを決めて、終わったらチェック。</p>
        </div>
      </section>

      <section class="task-summary" aria-label="タスク概要">
        <div class="metric is-zero">
          <span class="metric-label">のこり</span>
          <strong id="metric-open">0</strong>
        </div>
        <div class="metric danger is-zero">
          <span class="metric-label">期限すぎ</span>
          <strong id="metric-overdue">0</strong>
        </div>
        <div class="metric warn is-zero">
          <span class="metric-label">きょう</span>
          <strong id="metric-today">0</strong>
        </div>
        <div class="metric high is-zero">
          <span class="metric-label">だいじ</span>
          <strong id="metric-high">0</strong>
        </div>
      </section>

      <section class="task-compose" aria-labelledby="task-compose-title">
        <div class="section-heading">
          <h2 id="task-compose-title">新しく追加</h2>
          <span>日時もそのまま書けます</span>
        </div>
        <form id="task-add-form" class="task-compose-form" autocomplete="off">
          <div class="compose-input-row">
            <input id="task-text-input" name="text" type="text" placeholder="やることを書く（例：明日18時 牛乳を買う）" autocomplete="off" required>
            <button class="secondary-btn compact" id="task-details-toggle" type="button" title="詳しく設定">こまかく</button>
            <button class="primary-btn" type="submit">追加する</button>
          </div>
          <div id="task-preview-line" class="task-preview-line" hidden></div>
          <div id="task-details-section" class="task-details-section" hidden>
            <select id="task-priority-input" name="priority" aria-label="優先度">
              <option value="normal">優先度：ふつう</option>
              <option value="high">優先度：だいじ</option>
              <option value="low">優先度：あとで</option>
            </select>
            <input id="task-note-input" name="note" type="text" placeholder="メモ (任意)" autocomplete="off">
          </div>
          <div class="due-quick" id="due-quick" aria-label="期限クイック入力"></div>
        </form>
      </section>

      <section class="task-controlbar" aria-label="タスク操作">
        <div class="controlbar-left">
          <div class="segmented" id="task-view-seg" role="tablist" aria-label="表示切替">
            <button class="segmented-btn active" data-view="list" type="button" role="tab">ならべる</button>
            <button class="segmented-btn" data-view="calendar" type="button" role="tab">カレンダー</button>
          </div>
        </div>
      </section>

      <div class="task-error" id="task-error" role="alert" aria-live="polite"></div>

      <section class="task-list-shell" id="task-list-shell" aria-label="タスク一覧">
        <div class="task-list" id="task-list"></div>
      </section>

      <section class="task-calendar-shell" id="task-calendar-shell" aria-label="カレンダー" hidden>
        <div class="cal-toolbar">
          <div class="cal-nav">
            <button class="secondary-btn compact" id="cal-prev" type="button" aria-label="前の月">‹</button>
            <strong class="cal-title" id="cal-title"></strong>
            <button class="secondary-btn compact" id="cal-next" type="button" aria-label="次の月">›</button>
          </div>
          <div class="task-toolbar-actions">
            <span class="task-muted" id="cal-month-count"></span>
            <button class="secondary-btn compact" id="cal-today-btn" type="button">今日</button>
          </div>
        </div>
        <div class="cal-weekdays" id="cal-weekdays" aria-hidden="true"></div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-day-panel" id="cal-day-panel" hidden></div>
      </section>
    </main>
    <footer class="site-footer"><strong>LOCAL · OLLAMA</strong><span class="footer-sep">/</span><span>この端末のローカル実行環境</span><span class="footer-sep">/</span><span>subpc buddy</span></footer>
  </div>

  <script src="/static/tasks.js"></script>
  <script src="/static/shell-ui.js"></script>
</body>
</html>
