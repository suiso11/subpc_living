<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0d11">
  <title>subpc_living</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <!-- ヘッダー -->
    <div class="header">
      <div class="header-title">
        <span id="status-dot" class="status-dot"></span>
        <span>subpc_living</span>
      </div>
      <div class="header-actions">
        <nav class="top-nav" aria-label="画面切替">
          <a class="top-nav-link active" href="/">会話</a>
          <a class="top-nav-link" href="/tasks">タスク</a>
          <a class="top-nav-link" href="/logs">ログ</a>
        </nav>
        <button class="icon-btn" id="new-session-btn" title="新しい会話">🗑️</button>
        <button class="icon-btn" id="settings-btn" title="設定">⚙️</button>
      </div>
    </div>

    <!-- チャットエリア -->
    <div class="chat-area" id="chat-area">
      <div class="welcome">
        <div class="welcome-orb">✦</div>
        <h2>subpc_living</h2>
        <p>会話、音声入力、読み上げ</p>
        <a class="welcome-link" href="/tasks">タスクを見る →</a>
      </div>
    </div>

    <!-- 入力エリア -->
    <div class="input-area">
      <div class="input-row">
        <div class="input-wrapper">
          <textarea id="message-input" placeholder="メッセージを入力..." rows="1"></textarea>
        </div>
        <button class="mic-btn" id="mic-btn" title="音声入力">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
        <button class="send-btn" id="send-btn" title="送信">➤</button>
      </div>
      <div class="input-options">
        <label class="toggle-label">
          <input type="checkbox" class="toggle-input" id="tts-toggle" checked>
          <span class="toggle-switch"></span>
          読み上げ
        </label>
        <span class="stt-status" id="stt-status"></span>
      </div>
    </div>
  </div>

  <!-- 設定パネル -->
  <div class="settings-panel" id="settings-panel">
    <div class="settings-content">
      <div class="settings-header">
        <h3>⚙️ 設定</h3>
        <button class="icon-btn" id="settings-close">✕</button>
      </div>

      <div class="setting-group">
        <label>TTS ボイス</label>
        <select id="voice-select">
          <option value="jf_alpha">jf_alpha — 日本語 女性 (Alpha)</option>
        </select>
      </div>

      <div class="setting-group">
        <label>接続情報</label>
        <div class="conn-info">
          <strong>サーバー:</strong> <span id="server-url"></span><br>
          <strong>WebSocket:</strong> <span id="ws-status">接続中...</span>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    // 接続情報表示
    document.getElementById('server-url').textContent = location.origin;
  </script>
</body>
</html>
